name: Space-maX Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - godot-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-android:
    name: Export Godot Android debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Godot version
        run: godot --headless --version

      - name: Import project resources
        run: godot --headless --editor --path godot-game --quit

      - name: Export Android debug APK
        run: |
          mkdir -p godot-game/build
          godot --headless --path godot-game --export-debug "Android" godot-game/build/Space-maX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Space-maX-Godot-Android-debug
          path: godot-game/build/Space-maX.apk
          if-no-files-found: error
          retention-days: 14
