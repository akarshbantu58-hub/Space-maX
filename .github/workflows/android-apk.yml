name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - audit/ci-and-project-baseline
      - feature/touch-assembly-phase-1
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Space-maX Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.akcreations.spacemax",
            "appName": "Space-maX",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Space-maX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
