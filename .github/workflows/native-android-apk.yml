name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-native-apk:
    name: Build native Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Space-maX-Native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
